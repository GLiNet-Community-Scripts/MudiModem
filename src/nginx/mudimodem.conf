# MudiModem — serve FOTA-persisted view chunks and AT library.
# abfota_update does not restore /www, so the files live under
# /usr/share/mudimodem/www. These prefix locations map the SPA URLs
# onto that tree. gzip_static is already on globally.
# ^~ wins over regex locations and does not steal GL's other /views/* chunks.

location ^~ /views/gl-sdk4-ui-mudimodem {
    root /usr/share/mudimodem/www;
}

location ^~ /mudimodem/ {
    root /usr/share/mudimodem/www;
}
